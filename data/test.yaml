testinfo:
    - id: wowo_ui_mine_current_page_elements
      title: 星野APP当前我的页UI元素定位清单
      execute: 1
testcase:
    -
      operate_type: sleep
      params: 1
      path: 等待1秒，确保ViewPager容器加载完成
    -
      element_info: com.xinxin.wowo:id/vp
      find_type: id
      operate_type: check
      path: 验证主页面ViewPager容器存在，当前承载我的页内容
    -
      element_info: com.xinxin.wowo:id/nav
      find_type: id
      operate_type: check
      path: 验证底部导航栏容器存在
    -
      element_info: com.xinxin.wowo:id/lyRoot
      find_type: id
      operate_type: check
      path: 验证我的页根布局容器存在
    -
      element_info: com.xinxin.wowo:id/coordinatorLayout
      find_type: id
      operate_type: check
      path: 验证我的页可折叠协调布局容器存在
    -
      element_info: com.xinxin.wowo:id/app_bar_layout
      find_type: id
      operate_type: check
      path: 验证我的页顶部AppBar容器存在
