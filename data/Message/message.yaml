testinfo:
    - id: wowo_ui_message_current_page_elements
      title: 星野APP当前讯息页UI元素定位清单
      execute: 1
testcase:
    -
      element_info: com.xinxin.wowo:id/vp
      find_type: id
      operate_type: check
      path: 验证主页面ViewPager容器存在，当前承载讯息页内容
    -
      element_info: com.xinxin.wowo:id/nav
      find_type: id
      operate_type: check
      path: 验证底部导航栏容器存在
    -
      element_info: com.xinxin.wowo:id/viewpager
      find_type: id
      operate_type: check
      path: 验证讯息页内容ViewPager容器存在
    -
      element_info: com.xinxin.wowo:id/llTitle
      find_type: id
      operate_type: check
      path: 验证讯息页顶部标题栏容器存在
    -
      element_info: com.xinxin.wowo:id/indicator
      find_type: id
      operate_type: check
      path: 验证讯息页顶部标题/分栏指示器存在
    -
      element_info: //*[@text='訊息']
      find_type: xpath
      operate_type: check
      path: 验证当前页面标题为讯息
    -
      element_info: com.xinxin.wowo:id/llNews
      find_type: id
      operate_type: check
      path: 验证右上角消息功能入口容器存在
    -
      element_info: com.xinxin.wowo:id/ivFriendAddList
      find_type: id
      operate_type: click
      path: 点击右上角好友/联系人入口
    -
      element_info: 
      find_type: 
      operate_type: back
      times: 1
      path: 返回上一页/关闭当前弹层，恢复到当前讯息页
    -
      element_info: com.xinxin.wowo:id/vStatusTitle
      find_type: id
      operate_type: check
      path: 验证讯息页状态栏占位区域存在
    -
      element_info: com.xinxin.wowo:id/llNotificationTip
      find_type: id
      operate_type: check
      path: 验证开启推送提示横幅容器存在
    -
      element_info: com.xinxin.wowo:id/tvNotificationTip
      find_type: id
      operate_type: check
      path: 验证开启推送提示文案控件存在
    -
      element_info: //android.widget.TextView[contains(@text,'開啟推送')]
      find_type: xpath
      operate_type: check
      path: 验证开启推送提示文案显示
    -
      element_info: com.xinxin.wowo:id/tvOpen
      find_type: id
      operate_type: click
      path: 点击去开启按钮，进入系统推送权限设置或应用通知设置
    -
      element_info: 
      find_type: 
      operate_type: back
      times: 1
      path: 返回上一页/关闭当前弹层，恢复到当前讯息页
    -
      element_info: //*[@text='去開啟']
      find_type: xpath
      operate_type: click
      path: 通过文本点击去开启推送按钮
    -
      element_info: 
      find_type: 
      operate_type: back
      times: 1
      path: 返回上一页/关闭当前弹层，恢复到当前讯息页
    -
      element_info: com.xinxin.wowo:id/ivClose
      find_type: id
