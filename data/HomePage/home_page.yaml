testinfo:
    - id: wowo_ui_home_current_page_elements
      title: 星野APP当前首页推荐页UI元素定位清单
      execute: 1
testcase:
    -
      element_info: com.xinxin.wowo:id/vp
      find_type: id
      operate_type: check
      path: 验证主页面ViewPager容器存在，当前承载首页推荐页内容
    -
      element_info: com.xinxin.wowo:id/nav
      find_type: id
      operate_type: check
      path: 验证底部导航栏容器存在
    -
      element_info: com.xinxin.wowo:id/ivPortrait
      find_type: id
      operate_type: click
      path: 点击顶部用户头像区域，验证个人头像入口可交互
    -
      element_info: 
      find_type: 
      operate_type: back
      times: 1
      path: 返回上一页/关闭当前弹层，恢复到当前首页推荐页
    -
      element_info: com.xinxin.wowo:id/tvNick
      find_type: id
      operate_type: check
      path: 验证顶部用户昵称显示
